services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kush
      POSTGRES_USER: kush
      POSTGRES_PASSWORD: ${KUSH_DB_PASSWORD:?Set KUSH_DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kush_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kush -d kush"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kush_postgres:
